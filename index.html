
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Mandya CCE Supervision Tracker</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8fafc;
    --border: #d0d7de;
    --text: #0f172a;
    --muted: #475569;
    --navy: #1e3a5f;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --blue: #1d4ed8;
    --blue-bg: #eff6ff;
    --purple: #6b21a8;
    --purple-bg: #f3e8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Kannada", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 12px;
    max-width: 1180px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 2px solid var(--navy);
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; color: var(--navy); font-weight: 800; }
  .today-pill {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--navy);
    background: var(--blue-bg);
    border: 1px solid #bfdbfe;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* Upload Bar */
  .upload-card {
    background: var(--surface);
    border: 1.5px dashed var(--navy);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .upload-info h2 {
    font-size: 0.9rem;
    color: var(--navy);
    font-weight: 700;
  }
  .upload-info p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .upload-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    color: #fff;
    font-size: 0.84rem;
    font-weight: 700;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 40px;
    white-space: nowrap;
  }
  .upload-btn:active { opacity: 0.85; }
  #excelUpload { display: none; }

  /* Supervisor Selection (First) + Taluk Filter */
  .selector-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sel-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sel-group label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  select {
    width: 100%;
    padding: 9px 10px;
    min-height: 42px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    background: #fff;
    color: var(--text);
  }
  select:focus {
    outline: none;
    border-color: var(--navy);
  }

  /* Alert Pills */
  .pills {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 12px;
    scrollbar-width: none;
  }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text);
    font-size: 0.83rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    white-space: nowrap;
  }
  .pill .cnt {
    background: var(--surface);
    color: var(--navy);
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 800;
  }
  .pill.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .pill.active .cnt {
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
  }
  .pill[data-tab="today"].active { background: var(--red); border-color: var(--red); }
  .pill[data-tab="tomorrow"].active { background: var(--amber); border-color: var(--amber); }
  .pill[data-tab="next3"].active { background: var(--blue); border-color: var(--blue); }
  .pill[data-tab="overdue"].active { background: var(--purple); border-color: var(--purple); }

  .view-hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
  }

  /* Group Container */
  .group-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    background: #fff;
  }
  .group-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--surface);
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
  }
  .group-hdr h3 { font-size: 0.96rem; color: var(--navy); font-weight: 800; }
  .group-sub { font-size: 0.78rem; color: var(--muted); font-weight: 600; }

  /* Mobile Card List (< 768px) */
  .mobile-list { display: flex; flex-direction: column; }
  .exp-item {
    padding: 11px 12px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .exp-item:last-child { border-bottom: none; }
  .exp-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .exp-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .exp-date { font-size: 0.86rem; font-weight: 800; color: var(--text); }
  .exp-id { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .exp-mid { font-size: 0.87rem; color: var(--text); }
  .exp-mid strong { color: var(--navy); }
  .exp-meta { font-size: 0.78rem; color: var(--muted); }
  .exp-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
  }
  .pw-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .call-btn {
    display: inline-flex;
    align-items: center;
    padding: 6px 11px;
    border-radius: 6px;
    background: var(--blue-bg);
    color: var(--blue);
    border: 1px solid #bfdbfe;
    font-size: 0.8rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  /* Desktop Table (>= 768px) */
  .desktop-table { display: none; }
  @media (min-width: 768px) {
    .mobile-list { display: none; }
    .desktop-table { display: block; overflow-x: auto; }
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
    white-space: nowrap;
  }
  th {
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    font-size: 0.78rem;
  }
  tr:nth-child(even) td { background: #f8fafc; }
  .phone-link { color: var(--blue); text-decoration: none; font-weight: 700; }
  .phone-link:hover { text-decoration: underline; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 800;
  }
  .b-today { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .b-tomorrow { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; }
  .b-upcoming { background: var(--blue-bg); color: var(--blue); border: 1px solid #bfdbfe; }
  .b-future { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
  .b-overdue { background: var(--purple-bg); color: var(--purple); border: 1px solid #e9d5ff; }
  .b-sup { background: #e2e8f0; color: #0f172a; border-radius: 4px; }

  /* Actions & Footer */
  .actions-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn-sec {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--navy);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 38px;
  }
  .btn-sec:hover { border-color: var(--navy); }

  footer {
    margin-top: 20px;
    padding: 12px 8px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }

  .empty {
    text-align: center;
    padding: 28px 16px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-size: 0.88rem;
  }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    display: none;
    z-index: 999;
    white-space: nowrap;
  }

  @media print {
    .upload-card, .selector-bar, .pills, .actions-bar, .no-print { display: none !important; }
    .mobile-list { display: none !important; }
    .desktop-table { display: block !important; }
    body { padding: 0; }
    .group-card { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <h1>Mandya CCE Supervision Tracker</h1>
  <span class="today-pill" id="todayBadge"></span>
</header>

<!-- 1. UPLOAD LATEST FORM 2 PENDING LIST -->
<section class="upload-card no-print">
  <div class="upload-info">
    <h2>Upload latest Form 2 pending list</h2>
    <p id="dataSourceLabel" style="display:none;"></p>
  </div>
  <label for="excelUpload" class="upload-btn">Upload Excel (.xlsx)</label>
  <input type="file" id="excelUpload" accept=".xlsx,.xls" onchange="handleExcelUpload(event)">
</section>

<!-- 2. SUPERVISOR SELECTION FIRST (PLUS TALUK FILTER) -->
<div class="selector-bar no-print">
  <div class="sel-group">
    <label for="filterSup">Supervisor</label>
    <select id="filterSup" onchange="render()">
      <option value="ALL">All (DSO / AD / SI / ASO)</option>
      <option value="DSO">DSO</option>
      <option value="AD">AD</option>
      <option value="SI">SI</option>
      <option value="ASO">ASO</option>
    </select>
  </div>
  <div class="sel-group">
    <label for="filterTaluk">Taluk</label>
    <select id="filterTaluk" onchange="render()">
      <option value="ALL">All Taluks</option>
    </select>
  </div>
</div>

<!-- 3. ALERT PILLS -->
<div class="pills no-print">
  <button class="pill active" data-tab="today" onclick="switchTab('today')">
    Today <span class="cnt" id="cnt-today">0</span>
  </button>
  <button class="pill" data-tab="tomorrow" onclick="switchTab('tomorrow')">
    Tomorrow <span class="cnt" id="cnt-tomorrow">0</span>
  </button>
  <button class="pill" data-tab="next3" onclick="switchTab('next3')">
    Next 3 Days <span class="cnt" id="cnt-next3">0</span>
  </button>
  <button class="pill" data-tab="overdue" onclick="switchTab('overdue')">
    Overdue <span class="cnt" id="cnt-overdue">0</span>
  </button>
  <button class="pill" data-tab="all" onclick="switchTab('all')">
    All Pending <span class="cnt" id="cnt-all">0</span>
  </button>
</div>

<div class="view-hint" id="viewHint"></div>

<!-- 4. EXPERIMENT LIST -->
<div id="contentArea"></div>

<div class="actions-bar no-print">
  <button class="btn-sec" onclick="exportCSV()">Export CSV</button>
  <button class="btn-sec" onclick="window.print()">Print List</button>
</div>

<footer>
  Designed and developed by Gangadhar, Statistical Inspector, Malavalli Taluk Office, Mandya
</footer>

<div class="toast" id="toast"></div>

let activeTab = 'today';

// Reference Date is strictly fixed to Today
function getTodayISO() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

const TODAY_ISO = getTodayISO();

function addDaysDisp(baseISO, offsetDays) {
  const d = new Date(baseISO + 'T00:00:00');
  d.setDate(d.getDate() + offsetDays);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2400);
}

function populateTaluks() {
  const sel = document.getElementById('filterTaluk');
  const current = sel.value;
  const taluks = [...new Set(DATA.map(d => d.taluk).filter(Boolean))].sort();
  sel.innerHTML = '<option value="ALL">All Taluks</option>' + taluks.map(t => `<option value="${t}">${t}</option>`).join('');
  if (taluks.includes(current)) sel.value = current;
}

function daysDiffFromToday(dateStr) {
  if (!dateStr) return null;
  const d1 = new Date(dateStr + 'T00:00:00');
  const d2 = new Date(TODAY_ISO + 'T00:00:00');
  return Math.round((d1 - d2) / 86400000);
}

function getBadge(diff) {
  if (diff === null) return '<span class="badge b-future">NO DATE</span>';
  if (diff === 0) return '<span class="badge b-today">TODAY</span>';
  if (diff === 1) return '<span class="badge b-tomorrow">TOMORROW</span>';
  if (diff >= 2 && diff <= 3) return `<span class="badge b-upcoming">IN ${diff} DAYS</span>`;
  if (diff > 3) return `<span class="badge b-future">IN ${diff}d</span>`;
  return `<span class="badge b-overdue">${Math.abs(diff)}d OVERDUE</span>`;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.pill').forEach(el => el.classList.remove('active'));
  document.querySelector(`.pill[data-tab="${tab}"]`).classList.add('active');
  render();
}

function getBaseFiltered() {
  const sup = document.getElementById('filterSup').value;
  const tlk = document.getElementById('filterTaluk').value;
  return DATA.filter(d => (sup === 'ALL' || d.sup === sup) && (tlk === 'ALL' || d.taluk === tlk));
}

function getTabItems(withDiff, tab) {
  if (tab === 'today') return withDiff.filter(x => x.diff === 0);
  if (tab === 'tomorrow') return withDiff.filter(x => x.diff === 1);
  if (tab === 'next3') return withDiff.filter(x => x.diff !== null && x.diff >= 1 && x.diff <= 3);
  if (tab === 'overdue') return withDiff.filter(x => x.diff !== null && x.diff < 0);
  return withDiff;
}

// Sort Taluks by earliest pending alert date: Today (0) -> Tomorrow (1) -> 2 days -> 3 days -> Future -> Overdue
function getTalukSortRank(grp, tab) {
  if (tab === 'overdue') {
    const diffs = grp.map(x => x.diff).filter(d => d !== null);
    return diffs.length ? Math.min(...diffs) : 99999;
  }
  const upcomingDiffs = grp.map(x => x.diff).filter(d => d !== null && d >= 0);
  if (upcomingDiffs.length > 0) return Math.min(...upcomingDiffs);
  const pastDiffs = grp.map(x => x.diff).filter(d => d !== null && d < 0);
  if (pastDiffs.length > 0) return 10000 + Math.abs(Math.max(...pastDiffs));
  return 99999;
}

function render() {
  const base = getBaseFiltered();
  const withDiff = base.map(d => ({...d, diff: daysDiffFromToday(d.date)}));
  withDiff.sort((a, b) => (a.diff ?? 9999) - (b.diff ?? 9999) || a.taluk.localeCompare(b.taluk) || a.id - b.id);

  const listToday = getTabItems(withDiff, 'today');
  const listTomorrow = getTabItems(withDiff, 'tomorrow');
  const listNext3 = getTabItems(withDiff, 'next3');
  const listOverdue = getTabItems(withDiff, 'overdue');

  document.getElementById('cnt-today').textContent = listToday.length;
  document.getElementById('cnt-tomorrow').textContent = listTomorrow.length;
  document.getElementById('cnt-next3').textContent = listNext3.length;
  document.getElementById('cnt-overdue').textContent = listOverdue.length;
  document.getElementById('cnt-all').textContent = withDiff.length;

  const hints = {
    today: `Harvests scheduled for Today (${addDaysDisp(TODAY_ISO, 0)})`,
    tomorrow: `Harvests scheduled for Tomorrow (${addDaysDisp(TODAY_ISO, 1)})`,
    next3: `Harvests for Next 3 Days leaving today (${addDaysDisp(TODAY_ISO, 1)} to ${addDaysDisp(TODAY_ISO, 3)})`,
    overdue: `Past harvest dates before ${addDaysDisp(TODAY_ISO, 0)}`,
    all: `All pending supervision experiments (${withDiff.length}) — Taluks ordered by nearest alert date`
  };
  document.getElementById('viewHint').textContent = hints[activeTab];

  const items = getTabItems(withDiff, activeTab);
  const area = document.getElementById('contentArea');

  if (items.length === 0) {
    area.innerHTML = `<div class="empty">No pending supervision experiments found for this selection.</div>`;
    return;
  }

  const showSupCol = (document.getElementById('filterSup').value === 'ALL');

  // Group by Taluk
  const grouped = {};
  items.forEach(item => {
    const key = item.taluk || 'Unknown';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(item);
  });

  // Sort Taluk keys by earliest alert date (Today -> Tomorrow -> +2d -> +3d -> ...)
  const sortedTaluks = Object.keys(grouped).sort((a, b) => {
    const rankA = getTalukSortRank(grouped[a], activeTab);
    const rankB = getTalukSortRank(grouped[b], activeTab);
    if (rankA !== rankB) return rankA - rankB;
    return a.localeCompare(b);
  });

  let html = '';
  sortedTaluks.forEach(tlk => {
    const grp = grouped[tlk];
    // Within each taluk, put upcoming (Today, Tomorrow, +2d...) before past overdue when in "all" tab
    if (activeTab === 'all') {
      grp.sort((a, b) => {
        const aRank = (a.diff !== null && a.diff >= 0) ? a.diff : (10000 + Math.abs(a.diff ?? 9999));
        const bRank = (b.diff !== null && b.diff >= 0) ? b.diff : (10000 + Math.abs(b.diff ?? 9999));
        return aRank - bRank || a.id - b.id;
      });
    }
    const supCounts = {};
    grp.forEach(x => supCounts[x.sup] = (supCounts[x.sup] || 0) + 1);
    const sub = Object.entries(supCounts).map(([k, v]) => `${k}: ${v}`).join(' · ');

    const mobileCards = grp.map(r => `
      <div class="exp-item">
        <div class="exp-top">
          <div class="exp-left">
            ${getBadge(r.diff)}
            <span class="exp-date">${r.date_disp}</span>
            ${showSupCol ? `<span class="badge b-sup">${r.sup}</span>` : ''}
          </div>
          <span class="exp-id">#${r.id}</span>
        </div>
        <div class="exp-mid"><strong>${r.village}</strong> · ${r.crop}</div>
        <div class="exp-meta">${r.hobli} · Sy: ${r.syno}</div>
        <div class="exp-bottom">
          <span class="pw-name">${r.pw}</span>
          ${r.phone ? `<a class="call-btn" href="tel:${r.phone}">Call ${r.phone}</a>` : ''}
        </div>
      </div>
    `).join('');

    const tableRows = grp.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${getBadge(r.diff)}</td>
        <td><strong>${r.date_disp}</strong></td>
        ${showSupCol ? `<td><span class="badge b-sup">${r.sup}</span></td>` : ''}
        <td>${r.id}</td>
        <td>${r.hobli}</td>
        <td>${r.village}</td>
        <td>${r.crop}</td>
        <td>${r.syno}</td>
        <td>${r.pw}</td>
        <td><a class="phone-link" href="tel:${r.phone}">${r.phone}</a></td>
      </tr>
    `).join('');

    html += `
      <div class="group-card">
        <div class="group-hdr">
          <h3>${tlk} (${grp.length})</h3>
          <span class="group-sub">${sub}</span>
        </div>
        <div class="mobile-list">${mobileCards}</div>
        <div class="desktop-table">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Alert</th>
                <th>Harvest Date</th>
                ${showSupCol ? '<th>Supervisor</th>' : ''}
                <th>Exp ID</th>
                <th>Hobli / GP</th>
                <th>Village</th>
                <th>Crop</th>
                <th>Survey No</th>
                <th>PW Name</th>
                <th>PW Phone</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
    `;
  });

  area.innerHTML = html;
}

function exportCSV() {
  const base = getBaseFiltered().map(d => ({...d, diff: daysDiffFromToday(d.date)}));
  const rows = getTabItems(base, activeTab);
  if (rows.length === 0) { showToast('No rows to export.'); return; }
  const headers = ['Taluk','Supervisor','Experiment ID','Harvest Date','Hobli/GP','Village','Crop','Survey No','PW Name','PW Phone','Department','Designation'];
  const csv = [headers.join(',')].concat(rows.map(r =>
    [r.taluk, r.sup, r.id, r.date_disp, r.hobli, r.village, r.crop, r.syno, r.pw, r.phone, r.dept, r.desig]
      .map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')
  )).join('\n');
  const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Mandya_Supervision_${activeTab}_${TODAY_ISO}.csv`;
  a.click();
}

function parseDDMMYYYY(val) {
  if (!val) return { iso: '', disp: '' };
  const s = String(val).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    const dd = m[1].padStart(2, '0'), mm = m[2].padStart(2, '0'), yyyy = m[3];
    return { iso: `${yyyy}-${mm}-${dd}`, disp: `${dd}/${mm}/${yyyy}` };
  }
  return { iso: '', disp: s };
}

function handleExcelUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const wb = XLSX.read(evt.target.result, {type: 'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});

      let hdrIdx = -1;
      for (let i = 0; i < Math.min(30, rows.length); i++) {
        if (rows[i].some(c => String(c).trim() === 'Experiment Number')) {
          hdrIdx = i; break;
        }
      }
      if (hdrIdx === -1) { alert('Could not find "Experiment Number" header in uploaded Excel.'); return; }
      const hdr = rows[hdrIdx].map(c => String(c).trim());
      const col = name => hdr.findIndex(h => h.toLowerCase() === name.toLowerCase());

      const idxExp = col('Experiment Number');
      const idxTaluk = col('Taluk');
      const idxDate = col('Date of Harvest');
      const idxCrop = col('Crop');
      const idxHobli = col('Hobli/Gp Name');
      const idxVill = col('Village Name');
      const idxSy = col('Survey No');
      const idxPW = col('Name of PW');
      const idxPhone = col('Phone Number of PW');
      const idxDept = col('Department');
      const idxDesig = col('Designation');

      const mapMatched = new Map();
      for (let i = hdrIdx + 1; i < rows.length; i++) {
        const r = rows[i];
        const expId = parseInt(r[idxExp], 10);
        if (!expId || !SUPERVISION_MAP[expId]) continue;
        const vill = String(r[idxVill] || '').trim();
        if (mapMatched.has(expId)) {
          const existing = mapMatched.get(expId);
          if (vill && !existing.village.includes(vill)) existing.village += ' / ' + vill;
        } else {
          const dt = parseDDMMYYYY(r[idxDate]);
          mapMatched.set(expId, {
            sup: SUPERVISION_MAP[expId],
            id: expId,
            taluk: String(r[idxTaluk] || '').trim(),
            hobli: String(r[idxHobli] || '').trim(),
            village: vill,
            crop: String(r[idxCrop] || '').trim(),
            syno: String(r[idxSy] || '').trim(),
            date: dt.iso,
            date_disp: dt.disp,
            pw: String(r[idxPW] || '').trim(),
            phone: String(r[idxPhone] || '').split('.')[0].trim(),
            dept: String(r[idxDept] || '').trim(),
            desig: String(r[idxDesig] || '').trim()
          });
        }
      }
      DATA = Array.from(mapMatched.values());
      const lbl = document.getElementById('dataSourceLabel');
      lbl.textContent = `Loaded: ${file.name} (${DATA.length} Pending)`;
      lbl.style.display = 'block';
      populateTaluks();
      render();
      showToast(`Updated: ${DATA.length} pending experiments matched.`);
    } catch (err) {
      alert('Error reading Excel file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Initialize with Today fixed
document.getElementById('todayBadge').textContent = `Today: ${addDaysDisp(TODAY_ISO, 0)}`;
populateTaluks();
render();
</script>
